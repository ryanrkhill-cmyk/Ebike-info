name: Build CircularScroll APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Run circular gesture self-tests
        working-directory: CircularScroll
        run: |
          mkdir -p /tmp/circularscroll-tests
          javac -d /tmp/circularscroll-tests \
            app/src/main/java/com/circularscroll/app/CircularGestureEngine.java \
            tools/com/circularscroll/app/EngineSelfTest.java
          java -cp /tmp/circularscroll-tests com.circularscroll.app.EngineSelfTest

      - name: Build and lint APK
        working-directory: CircularScroll
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify APK package and signature
        run: |
          APK=CircularScroll/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | head -20
          $ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$APK"
          if $ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$APK" | grep -q android.permission.INTERNET; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: CircularScroll-v1.1.0-APK
          path: CircularScroll/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
