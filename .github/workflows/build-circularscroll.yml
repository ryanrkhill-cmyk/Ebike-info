name: Build CircularScroll v1.3 APK
on:
  push:
    branches: [ circularscroll-v1.3-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build and lint APK
        working-directory: CircularScroll
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify v1.3 APK package, permissions and signature
        run: |
          APK=CircularScroll/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='13'" /tmp/badging.txt
          grep -q "versionName='1.3.0'" /tmp/badging.txt
          $ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q android.permission.INTERNET /tmp/permissions.txt; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: CircularScroll-v1.3.0-APK
          path: CircularScroll/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
